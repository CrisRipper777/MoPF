defaults:
  - dataset: Movies
  - task: nc
  - model: mlp
  - _self_

seed: 42
num_runs: 3
device: cuda:0

# Frozen F2 interface. CLI overrides use, for example, ablation=wo_tcpr.
ablation: full

paths:
  data_root: /hdd1/DataInHere/YHF/data
  split_root: /hdd1/DataInHere/YHF/data/MAGB_split
  output_root: outputs

logging:
  level: INFO

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.output_root}/${now:%Y-%m-%d}/${now:%H-%M-%S}
