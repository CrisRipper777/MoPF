name: cssi_v1
version: cssi_v1
architecture_version: cssi_v1_brsm_v1

hidden_dim: 256
dropout: 0.2
norm: layernorm

max_order: 3
num_layers: ${model.max_order}
diffusion_add_self_loops: true

# false is the shared unit-edge backbone; true reuses the historical
# diagonal-cosine relation calibration from CoSIMAGFinal.
use_mrc: false
edge_metric: learned_diag_cos
metric_init_seed: 20260910
edge_weight_min: 0.1
edge_weight_temperature: 0.35
eps: 1.0e-8

filter_rank: 4
multihop_state: anchored
multihop_response: cumulative
multihop_anchor_alpha: 0.0

global_prior_restart: 0.15
global_prior_order: 2
hop_interaction_layers: 1
hop_interaction_heads: 1
hop_interaction_dropout: 0.0
hop_interaction_order_embedding: true
hop_interaction_gate_init: 0.10
relation_descriptor_eps: 1.0e-6
relation_bias_init: 0.10
relation_init_seed: 20260921
relation_init_std: 0.02

fusion: concat_residual_mlp

# P4 BRSM flags. The runner overrides condition_mode and adapter_type.
condition_mode: same # self | same
adapter_type: brsm # brsm | scalar | none
adapter_enabled: true
control_dim: 64
response_rank: 8
lambda_max: 0.2
lambda_init: 0.05

